<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhoneDeck</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #15171a;
        --muted: #667085;
        --accent: #2563eb;
        --danger: #dc2626;
        --ok: #16a34a;
        --warn: #d97706;
        --border: #d9dde3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #181b21;
          --text: #eef0f3;
          --muted: #9aa3b2;
          --accent: #6ea0ff;
          --danger: #ff6b6b;
          --ok: #4ade80;
          --warn: #fbbf24;
          --border: #2a2f38;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 480px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px;
      }
      #status {
        font-size: 0.9rem;
        color: var(--muted);
      }
      #status[data-state="on"] {
        color: var(--ok);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-top: 16px;
      }
      #hint {
        margin: 0 0 14px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        font: inherit;
        font-size: 0.85rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
      }
      button.danger {
        background: var(--danger);
      }
      button.plain {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      button.corner {
        width: 40px;
        height: 40px;
        padding: 0;
        margin: 0;
        display: grid;
        place-items: center;
        border-radius: 12px;
      }
      #message {
        min-height: 1.3em;
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* The two speedometers */
      .dials {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .gauge {
        text-align: center;
      }
      .dial {
        width: 100%;
        display: block;
      }
      .dial path {
        fill: none;
        stroke-width: 8;
      }
      .dial .track {
        stroke: var(--border);
      }
      .dial .fill {
        stroke: var(--ok);
        transition: stroke-dashoffset 0.4s, stroke 0.4s;
      }
      .dial .needle {
        stroke: var(--text);
        stroke-width: 2;
        stroke-linecap: round;
        transform-origin: 50px 50px;
        transform: rotate(-90deg);
        transition: transform 0.4s;
      }
      .dial .hub {
        fill: var(--text);
      }
      .gauge[data-level="warn"] .fill {
        stroke: var(--warn);
      }
      .gauge[data-level="high"] .fill {
        stroke: var(--danger);
      }
      .gauge-value {
        font-size: 1.5rem;
        font-weight: 700;
        margin-top: -4px;
      }
      .gauge-name {
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* The command buttons: rounded squares */
      .tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }
      button.tile {
        aspect-ratio: 1;
        margin: 0;
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 20px;
        font-size: 0.95rem;
      }
      button.tile .icon {
        font-size: 2.2rem;
        line-height: 1;
      }
      button.tile:active {
        filter: brightness(0.85);
      }
      button.tile.green {
        background: var(--ok);
        color: #052e16;
      }

      details {
        margin-top: 16px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      #log {
        margin: 8px 0 0;
        white-space: pre-wrap;
        max-height: 8rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>PhoneDeck</h1>
        <div id="status" data-state="off">Not connected</div>
      </div>
      <button id="disconnect" class="corner plain" title="Disconnect" aria-label="Disconnect" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M6.6 6.6a8 8 0 1 0 10.8 0" />
        </svg>
      </button>
    </header>
    <div id="message" role="status"></div>

    <div class="card" id="service-row">
      <p id="hint"></p>
      <label for="link" id="link-label">Or paste the pairing link</label>
      <input id="link" type="text" autocomplete="off" spellcheck="false" />
      <button id="connect">Connect</button>
    </div>

    <div id="deck" hidden>
      <div class="card dials">
        <!-- A half circle of length 100 (pathLength), so a percentage is the length drawn. -->
        <div class="gauge" id="cpu">
          <svg class="dial" viewBox="0 0 100 56" aria-hidden="true">
            <path class="track" d="M 10 50 A 40 40 0 0 1 90 50" pathLength="100" />
            <path class="fill" d="M 10 50 A 40 40 0 0 1 90 50" pathLength="100"
                  stroke-dasharray="100" stroke-dashoffset="100" />
            <line class="needle" x1="50" y1="50" x2="50" y2="16" />
            <circle class="hub" cx="50" cy="50" r="4" />
          </svg>
          <div class="gauge-value">-</div>
          <div class="gauge-name">CPU</div>
        </div>
        <div class="gauge" id="ram">
          <svg class="dial" viewBox="0 0 100 56" aria-hidden="true">
            <path class="track" d="M 10 50 A 40 40 0 0 1 90 50" pathLength="100" />
            <path class="fill" d="M 10 50 A 40 40 0 0 1 90 50" pathLength="100"
                  stroke-dasharray="100" stroke-dashoffset="100" />
            <line class="needle" x1="50" y1="50" x2="50" y2="16" />
            <circle class="hub" cx="50" cy="50" r="4" />
          </svg>
          <div class="gauge-value">-</div>
          <div class="gauge-name">RAM</div>
        </div>
      </div>

      <!-- One button per command: data-action is the name the computer knows. -->
      <div class="tiles">
        <button class="tile danger" data-action="lock" data-label="The computer is locked">
          <span class="icon">&#x1F512;</span>Lock
        </button>
      </div>
    </div>

    <details>
      <summary>Details</summary>
      <pre id="log"></pre>
    </details>

    <script type="module" src="app.js"></script>
  </body>
</html>
